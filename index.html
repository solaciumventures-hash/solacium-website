<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solacium</title>
  <meta name="description" content="Solacium — a London-based software studio.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <div class="container">
      <div class="hero">
        <div class="logo">Solacium</div>
        <p class="tagline">Solacium is a London-based, proprietary software studio. We design, develop, and maintain innovative digital experiences.</p>
      </div>

      <div class="contact-section" id="contact">
        <div class="contact-label">Contact us</div>
        <form class="contact-form" method="POST" action="https://formspree.io/f/mlgoawag">
          <input type="text" name="name" placeholder="Your name" required>
          <input type="email" name="email" placeholder="Your email" required>
          <textarea name="message" placeholder="Your message" required></textarea>
          <input type="hidden" name="_subject" value="New message from solacium.dev">
          <button type="submit">Send message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-info">
        Solacium Ventures Ltd &middot; Registered in England and Wales<br>
        Company No. 16338230 &middot; 124 City Road, London, EC1V 2NX
      </div>
      <div class="footer-links">
        <a href="/privacy.html">Privacy</a>
      </div>
    </div>
  </footer>

  <script>
    document.querySelectorAll('.contact-form').forEach(function(form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = form.querySelector('button');
        btn.textContent = 'Sending...';
        btn.disabled = true;

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        }).then(function(r) {
          if (r.ok) {
            btn.textContent = 'Message sent — thank you';
            form.querySelectorAll('input, textarea').forEach(function(el) {
              el.disabled = true;
              if (el.type !== 'hidden') el.value = '';
            });
          } else {
            btn.textContent = 'Try again';
            btn.disabled = false;
          }
        }).catch(function() {
          btn.textContent = 'Try again';
          btn.disabled = false;
        });
      });
    });
  </script>

</body>
</html>
